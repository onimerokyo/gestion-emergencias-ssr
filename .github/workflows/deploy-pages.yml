name: Publicar Gestión de Emergencias SSR

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependencias verificadas
        run: npm ci
      - name: Compilar sitio
        run: npm run build:github
        env:
          VITE_BASE_PATH: /gestion-emergencias-ssr/
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Preparar publicación
        uses: actions/upload-pages-artifact@v4
        with:
          path: github-pages-dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
